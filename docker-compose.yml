services:
    # ---------------------------------------------------------------
    # Application (PHP 8.4-FPM)
    # ---------------------------------------------------------------
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: hermes-isp-billing-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
            - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
        environment:
            - DB_CONNECTION=pgsql
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_DATABASE=${DB_DATABASE:-hermes_isp}
            - DB_USERNAME=${DB_USERNAME:-hermes}
            - DB_PASSWORD=${DB_PASSWORD:-secret}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - QUEUE_CONNECTION=redis
            - CACHE_STORE=redis
            - SESSION_DRIVER=redis
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - hermes

    # ---------------------------------------------------------------
    # Web server (Nginx)
    # ---------------------------------------------------------------
    nginx:
        image: nginx:1.27-alpine
        container_name: hermes-isp-billing-nginx
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8090}:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - hermes

    # ---------------------------------------------------------------
    # Queue worker (separate process sharing the app image)
    # ---------------------------------------------------------------
    queue:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: hermes-isp-billing-queue
        restart: unless-stopped
        working_dir: /var/www
        command: php artisan queue:work redis --queue=default --tries=3 --max-time=3600
        volumes:
            - .:/var/www
        environment:
            - APP_ENV=${APP_ENV:-production}
            - DB_CONNECTION=pgsql
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_DATABASE=${DB_DATABASE:-hermes_isp}
            - DB_USERNAME=${DB_USERNAME:-hermes}
            - DB_PASSWORD=${DB_PASSWORD:-secret}
            - REDIS_HOST=redis
            - QUEUE_CONNECTION=redis
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - hermes

    # ---------------------------------------------------------------
    # Scheduler (cron inside the app image)
    # ---------------------------------------------------------------
    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: hermes-isp-billing-scheduler
        restart: unless-stopped
        working_dir: /var/www
        command: php artisan schedule:work
        volumes:
            - .:/var/www
        environment:
            - APP_ENV=${APP_ENV:-production}
            - DB_CONNECTION=pgsql
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_DATABASE=${DB_DATABASE:-hermes_isp}
            - DB_USERNAME=${DB_USERNAME:-hermes}
            - DB_PASSWORD=${DB_PASSWORD:-secret}
            - REDIS_HOST=redis
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - hermes

    # ---------------------------------------------------------------
    # PostgreSQL
    # ---------------------------------------------------------------
    postgres:
        image: postgres:17-alpine
        container_name: hermes-isp-billing-postgres
        restart: unless-stopped
        environment:
            - POSTGRES_DB=${DB_DATABASE:-hermes_isp}
            - POSTGRES_USER=${DB_USERNAME:-hermes}
            - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hermes} -d ${DB_DATABASE:-hermes_isp}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - hermes

    # ---------------------------------------------------------------
    # Redis
    # ---------------------------------------------------------------
    redis:
        image: redis:7-alpine
        container_name: hermes-isp-billing-redis
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redisdata:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - hermes

volumes:
    pgdata:
    redisdata:

networks:
    hermes:
        driver: bridge
